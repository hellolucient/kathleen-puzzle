<!DOCTYPE html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name=apple-mobile-web-app-capable content=yes>
<title>My Story Games</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff8ec;color:#3e261c;font-family:Georgia,serif;overflow:auto;touch-action:manipulation}
body{min-height:100%;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#app{min-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
h1{font-size:28px;margin:8px 0}
h2{font-size:20px;margin:6px 0}
p{font-size:20px;line-height:1.35}
.row{display:flex;gap:10px;flex-wrap:wrap}
button,.card{font-family:Georgia,serif;font-size:18px;min-height:56px;padding:12px 16px;border-radius:16px;border:3px solid #9a6e30;background:#fff;color:#3e261c}
.card{flex:1;min-width:140px;text-align:center}
button.on,.card.on{background:#3e261c;color:#fff8ec}
img.pic{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:#f3e4c8}
input,textarea{font-size:18px;padding:10px;border-radius:12px;border:3px solid #9a6e30;width:100%}
#stage{position:relative;flex:1;min-height:360px;border-radius:14px;background:#f3e4c8;overflow:hidden}
.hide{display:none!important}
canvas{touch-action:none}
button.back{align-self:flex-start;min-width:96px}.pal{position:relative;z-index:5;background:#fff8ec;padding:8px 0}.wrap{position:relative;z-index:1;width:100%;max-height:44vh;overflow:hidden}.wrap canvas{display:block;width:100%;height:auto;max-height:44vh}.dot{position:absolute;width:56px;height:56px;border-radius:50%;z-index:3}</style></head><body><div id=app></div>
<script src=data.js></script>
<script src=app.js></script>
</body></html>
